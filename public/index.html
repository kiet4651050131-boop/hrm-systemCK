<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176FA8">
<title>HRM – Quản lý nhân sự</title>
<style>
:root{
--bg:#F5F7F9;--card:#fff;--tx:#1B3042;--mut:#62788B;--bd:#DEE4E9;--bd2:#EDF0F3;
--pri:#167FC1;--pri-h:#106CA8;--pri-tx:#125F95;--on-pri:#fff;--pri2:#E1F1FC;
--acc:#F5B94C;--acc-h:#E7A936;--on-acc:#392600;
--side:#123B58;--side2:#1A5277;--side-tx:#E2F2FC;--side-mut:#A8C9DE;
--hero:#EEF4F8;--hero-tx:#163E5B;--hero-mut:#547B97;
--ok:#17734B;--okb:#E0F4E9;--wa:#8B5B06;--wab:#FFF2D4;--bad:#B3383B;--badb:#FDE8E7;
--b-butter:#FFF0CC;--i-butter:#76530A;--b-peach:#E5F3FC;--i-peach:#216A99;--b-lilac:#E5EAFE;--i-lilac:#475EAA;
--b-mint:#DDF3EE;--i-mint:#176B5C;--b-sky:#D9EEFC;--i-sky:#17618E;--b-pink:#FBE8F0;--i-pink:#944364;
--sh:0 2px 6px rgba(25,74,108,.04),0 12px 28px -20px rgba(26,91,135,.25);
--k1:#167FC1;--k2:#39A5C7;--k3:#627FD0;--k4:#E6AD3B}
@media (prefers-color-scheme:dark){:root{
--bg:#101D29;--card:#172837;--tx:#E7F1F8;--mut:#9BB0C1;--bd:#294153;--bd2:#203647;
--pri:#58B3EA;--pri-h:#7AC6F2;--pri-tx:#85CFF5;--on-pri:#08283B;--pri2:#1B3B50;
--acc:#F5C46A;--acc-h:#FFD27F;--on-acc:#30220A;
--side:#0B2437;--side2:#163B56;--side-tx:#E2F2FC;--side-mut:#91B4CC;
--hero:#1C384D;--hero-tx:#E5F4FD;--hero-mut:#A9C6D9;
--ok:#77D2A0;--okb:#1A3E33;--wa:#F1C36E;--wab:#443719;--bad:#F39A99;--badb:#45262B;
--b-butter:#443A25;--i-butter:#F0D38D;--b-peach:#203B4C;--i-peach:#A7D7F2;--b-lilac:#292F4E;--i-lilac:#BCC8FF;
--b-mint:#1C3B39;--i-mint:#9CE0D0;--b-sky:#1C3A50;--i-sky:#A1D8F7;--b-pink:#422B3D;--i-pink:#F1B7D1;
--sh:0 2px 10px rgba(0,0,0,.2);--k1:#58B3EA;--k2:#4CB8D0;--k3:#9BAAF0;--k4:#F1C36E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:var(--tx)}
a{color:var(--pri-tx)}
h1,h2,.serif{font-family:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;font-variation-settings:"SOFT" 100;letter-spacing:-.01em}
h1,h2{margin:0 0 8px}h2{font-size:18px;font-weight:600}.mut{color:var(--mut);font-size:13px}
input,select,textarea{width:100%;padding:10px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 16%,transparent)}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:14px 0 5px}
.btn{border:0;background:var(--pri);color:var(--on-pri);padding:9px 18px;border-radius:99px;cursor:pointer;width:auto;font-weight:600;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--pri-h)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.6;cursor:default}
.btn.g{background:var(--pri2);color:var(--pri-tx)}.btn.g:hover{background:color-mix(in srgb,var(--pri) 18%,var(--card))}
.btn.r{background:var(--badb);color:var(--bad)}.btn.r:hover{background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.btn.acc{background:var(--acc);color:var(--on-acc)}.btn.acc:hover{background:var(--acc-h)}
.btn.s{padding:5px 13px;font-size:12.5px}
.btn:focus-visible,.ni:focus-visible,.mb:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.ico{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico .f{fill:currentColor;fill-opacity:.2}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
.err{background:var(--badb);color:var(--bad);padding:9px 14px;border-radius:12px;margin-top:12px;font-size:13px}
.okm{background:var(--okb);color:var(--ok);padding:9px 14px;border-radius:12px;margin-top:12px;font-size:13px}
.toast-root{position:fixed;right:20px;top:18px;z-index:80;display:grid;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;min-width:250px;max-width:min(420px,calc(100vw - 32px));padding:12px 16px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);box-shadow:var(--sh);animation:pop .18s ease-out}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pri);flex:none}
.toast.error::before{background:var(--bad)}.toast.success::before{background:var(--ok)}
.btn[aria-busy="true"]{cursor:wait;opacity:.82}
.btn[aria-busy="true"]::before{content:"";display:inline-block;width:13px;height:13px;margin:0 7px 0 0;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 4px 2px;color:var(--mut);font-size:12.5px}
.pager .btn{min-width:36px;padding:5px 10px}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{width:148px;height:148px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:23px;border-radius:50%;background:var(--card)}
.donut-center{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;font:600 25px/1.1 "Fraunces",Georgia,serif;color:var(--tx)}
.donut-center small{font:500 11px/1.3 "Be Vietnam Pro",sans-serif;color:var(--mut);margin-top:5px}
.donut-legend{display:grid;gap:10px;min-width:175px}
.donut-legend span{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.donut-legend b{margin-left:auto;color:var(--tx);font-variant-numeric:tabular-nums}
.legend-dot{width:9px;height:9px;border-radius:50%;background:var(--pri);flex:none}
.columns{height:210px;display:flex;align-items:stretch;gap:12px;padding:12px 4px 0;border-bottom:1px solid var(--bd)}
.column{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;text-align:center;font-size:11px;color:var(--mut)}
.column b{font-size:10px;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
.column i{display:block;width:min(34px,70%);min-height:3px;border-radius:7px 7px 2px 2px;background:var(--k1)}
.column:nth-child(2n) i{background:var(--k2)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.85fr);gap:14px;margin-bottom:14px}
.dash-panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
.dash-panel h2{margin-bottom:12px}
.dash-list{display:grid}
.dash-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd2)}
.dash-row:last-child{border-bottom:0}
.dash-row .dash-row-main{flex:1;min-width:0}
.dash-row b,.dash-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-row small{color:var(--mut);margin-top:2px}
.dash-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dash-shortcut{display:flex;align-items:center;gap:8px;min-height:42px;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--card);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.dash-shortcut:hover{background:var(--bg);border-color:var(--pri)}
.dash-shortcut .ico{width:17px;height:17px;color:var(--pri-tx)}
.dash-progress{height:9px;margin:12px 0;background:var(--bd2);border-radius:5px;overflow:hidden}
.dash-progress i{display:block;height:100%;background:var(--pri);border-radius:5px}
.dash-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dash-stat{padding:9px;background:var(--bg);border-radius:7px}
.dash-stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.dash-stat small{display:block;color:var(--mut);font-size:11px}

/* đăng nhập */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-l{position:relative;background:linear-gradient(145deg,#123B58 0%,#17638D 58%,#2484B5 100%);color:var(--side-tx);padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.auth-l:before,.auth-l:after{content:"";position:absolute;z-index:0;border:1px solid rgba(218,243,255,.16);border-radius:50%;pointer-events:none}
.auth-l:before{width:430px;height:430px;right:-170px;top:-150px;background:radial-gradient(circle at 35% 65%,rgba(111,202,244,.18),rgba(111,202,244,0) 68%);animation:drift 9s ease-in-out infinite alternate}
.auth-l:after{width:260px;height:260px;left:-125px;bottom:-135px;background:rgba(132,208,244,.07)}
.auth-l>*{position:relative;z-index:1}
.auth-l h1{font-size:40px;line-height:1.12;font-weight:600;margin:0 0 14px;color:#F1FAFF;max-width:13em}
.auth-l p{margin:0;color:var(--side-mut);max-width:26em;font-size:15px}
.auth-l svg.scene{display:block;width:100%;max-width:520px;margin:28px 0 0}
.auth-r{display:grid;place-items:center;padding:32px}
.auth-f{width:100%;max-width:360px}
.auth-f h2{font-size:28px;font-weight:600;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:11px;font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand svg{width:36px;height:36px;flex:none}
.brand small{display:block;font:500 11.5px/1.2 "Be Vietnam Pro",sans-serif;opacity:.7;letter-spacing:0}

/* khung ứng dụng */
.sb{position:fixed;inset:0 auto 0 0;width:256px;background:var(--side);color:var(--side-tx);padding:22px 14px 16px;display:flex;flex-direction:column;z-index:30;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sb .brand{color:#F1FAFF;padding:0 8px 22px}
.nv{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.ni{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-tx);padding:9px 12px;border-radius:14px;cursor:pointer;text-align:left;font-weight:500;width:100%;transition:background .15s}
.ni .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--side-mut);transition:background .15s,color .15s}
.ni .ico{width:19px;height:19px}
.ni:hover{background:rgba(255,255,255,.07)}
.ni.on{background:var(--side2);color:#fff}
.ni.on .ic{background:#75C8F1;color:#103C58}
.ni.on .ic .f{fill-opacity:.35}
.me{margin-top:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.07)}
.me-profile{display:flex;align-items:center;gap:10px;width:100%;padding:4px;border:0;border-radius:10px;background:none;color:inherit;text-align:left;cursor:pointer;transition:background .15s}
.me-profile:hover,.me-profile.on{background:rgba(255,255,255,.1)}
.me-profile:focus-visible{outline:2px solid #75C8F1;outline-offset:4px}
.me-t{display:flex;align-items:center;gap:10px;min-width:0}
.me-t b{display:block;font-size:13.5px;line-height:1.3;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.me-t span.r{font-size:12px;color:var(--side-mut)}
.me-hint{display:flex;align-items:center;gap:6px;margin:9px 0 0 48px;color:#B8DDF2;font-size:11.5px;font-weight:600}
.me-hint .ico{width:14px;height:14px}
.me-a{display:flex;gap:6px;margin-top:10px}
.me-a button{flex:1;border:0;border-radius:99px;padding:6px 8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;background:rgba(255,255,255,.1);color:var(--side-tx)}
.me-a button:hover{background:rgba(255,255,255,.18)}
.me-a .ico{width:14px;height:14px}
.ct{margin-left:256px;min-height:100vh}
.main{max-width:1120px;margin:0 auto;padding:32px 36px 56px}
.ph{margin-bottom:22px}.ph h1{font-size:30px;font-weight:600;margin:0}.ph .mut{margin-top:2px}
.mbar{display:none}
.scrim{display:none}
@media (max-width:900px){
.sb{transform:translateX(-100%)}.sb.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
.scrim.open{display:block;position:fixed;inset:0;background:rgba(8,24,29,.5);z-index:25}
.ct{margin-left:0}
.mbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--side);color:#F1FAFF;position:sticky;top:0;z-index:20}
.mbar .brand{font-size:19px}.mbar .brand svg{width:30px;height:30px}
.mb{border:0;background:rgba(255,255,255,.1);color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.main{padding:20px 16px 44px}.ph h1{font-size:25px}
.auth{grid-template-columns:1fr}.auth-l{padding:26px 24px 8px}.auth-l h1{font-size:28px}.auth-l svg.scene,.auth-l p{display:none}.auth-r{padding:24px 20px 40px;align-items:start}}

/* avatar */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.l{width:42px;height:42px;font-size:15px}
.av-0{background:var(--b-butter);color:var(--i-butter)}.av-1{background:var(--b-peach);color:var(--i-peach)}.av-2{background:var(--b-lilac);color:var(--i-lilac)}
.av-3{background:var(--b-mint);color:var(--i-mint)}.av-4{background:var(--b-sky);color:var(--i-sky)}.av-5{background:var(--b-pink);color:var(--i-pink)}
.who{display:flex;align-items:center;gap:11px;min-width:0}.who b{display:block;font-weight:600;line-height:1.3}.who .mut{display:block;line-height:1.3}
.profile-head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:22px;border-bottom:1px solid var(--bd2)}
.profile-person{display:flex;align-items:center;gap:14px;min-width:0}
.profile-person .av{width:54px;height:54px;font-size:19px}
.profile-person h2{margin:0 0 3px;font-size:21px}
.profile-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.profile-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:44px;padding-top:8px}
.profile-field{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;min-width:0;padding:16px 0;border-bottom:1px solid var(--bd2)}
.profile-field span{color:var(--mut);font-size:13px}
.profile-field b{text-align:right;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
@media(max-width:700px){.profile-head{align-items:flex-start;flex-direction:column}.profile-actions{justify-content:flex-start}.profile-fields{grid-template-columns:1fr;column-gap:0}.profile-field{padding:13px 0}}

/* thanh công cụ, bảng */
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.bar input{flex:1;min-width:160px}.bar select{width:auto}.sp{flex:1}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--pri);color:var(--on-pri)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd2);vertical-align:middle}
th{font-size:12.5px;font-weight:600;color:var(--mut);background:color-mix(in srgb,var(--pri) 5%,var(--card));white-space:nowrap}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
tbody tr:last-child td,table tr:last-child td{border-bottom:0}
tr:hover td{background:color-mix(in srgb,var(--pri) 4%,transparent)}
tr.dim td{color:var(--mut);background:var(--bg)}
.card.tw{padding:10px 12px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 11px;border-radius:99px;background:var(--pri2);color:var(--pri-tx);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.tag.nd::before{display:none}
.t-ok{background:var(--okb);color:var(--ok)}.t-wa{background:var(--wab);color:var(--wa)}.t-bad{background:var(--badb);color:var(--bad)}
.t-off{background:var(--bd2);color:var(--mut)}

/* tổng quan */
.hero{position:relative;display:flex;align-items:stretch;justify-content:space-between;gap:20px;margin-bottom:18px;padding:30px 36px;border:1px solid color-mix(in srgb,var(--pri) 13%,var(--bd));border-radius:24px;background:linear-gradient(112deg,var(--hero) 0%,color-mix(in srgb,var(--hero) 88%,var(--card)) 68%,color-mix(in srgb,var(--pri) 14%,var(--card)) 100%);color:var(--hero-tx);overflow:hidden;min-height:190px}
.hero:after{content:"";position:absolute;width:250px;height:250px;right:13%;top:-175px;border-radius:50%;border:1px solid color-mix(in srgb,var(--pri) 14%,transparent);box-shadow:0 0 0 24px color-mix(in srgb,var(--pri) 4%,transparent),0 0 0 48px color-mix(in srgb,var(--pri) 3%,transparent);pointer-events:none}
.hero>div:first-child{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;max-width:520px}
.hero h1{font-size:34px;line-height:1.14;font-weight:600;margin:0 0 8px}.hero p{margin:0;color:var(--hero-mut);font-size:15px}
.hero svg.scene{display:block;position:relative;z-index:1;width:34%;max-width:300px;min-width:210px;align-self:flex-end;margin:-12px -10px -25px 0;filter:drop-shadow(0 10px 14px rgba(36,105,145,.08))}
.chk{display:flex;align-items:center;gap:18px;align-self:flex-start;margin-top:20px;background:var(--card);color:var(--tx);border-radius:20px;padding:12px 14px 12px 20px;box-shadow:0 18px 34px -22px rgba(31,91,129,.35)}
.chk small{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px}.chk b{font:600 18px/1.3 "Fraunces",Georgia,serif;display:block;margin:2px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{--kb:var(--b-mint);--ki:var(--i-mint);background:var(--kb);color:var(--ki);border:1px solid color-mix(in srgb,var(--ki) 8%,transparent);border-radius:24px;padding:18px 20px 16px;min-height:132px;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.kpi:nth-child(5n+2){--kb:var(--b-peach);--ki:var(--i-peach)}.kpi:nth-child(5n+3){--kb:var(--b-lilac);--ki:var(--i-lilac)}
.kpi:nth-child(5n+4){--kb:var(--b-butter);--ki:var(--i-butter)}.kpi:nth-child(5n+5){--kb:var(--b-sky);--ki:var(--i-sky)}
.ki{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 62%,transparent)}
.ki .ico{width:21px;height:21px}
.kpi .v{font:600 38px/1 "Fraunces",Georgia,serif;margin:auto 0 4px;padding-top:12px;font-variant-numeric:lining-nums tabular-nums}
.kpi small{display:block;font-size:13px;font-weight:500;opacity:.9}.kpi small+small{opacity:.7;font-weight:400}
.brow{display:grid;grid-template-columns:minmax(80px,130px) 1fr minmax(44px,auto);align-items:center;gap:12px;margin:11px 0;font-size:13px}
.brow .trk{height:12px;border-radius:99px;background:var(--bd2);overflow:hidden}
.brow i{display:block;height:100%;border-radius:99px;background:var(--k1);transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.brow:nth-of-type(4n+2) i{background:var(--k2)}.brow:nth-of-type(4n+3) i{background:var(--k3)}.brow:nth-of-type(4n+4) i{background:var(--k4)}
.brow b{font-variant-numeric:tabular-nums;text-align:right}

</style></head><body>
<div id="app"></div><div id="m"></div><div class="toast-root" id="toast-root" aria-live="polite"></div>
<script src="ui.js"></script>
<script src="modules.js"></script>
<script>
var TOKEN=null,me=null,view='dash',q='',fd='',depts=[],poss=[],ROLES={admin:'Admin',hr:'HR',manager:'Quản lý',employee:'Nhân viên'};
try{TOKEN=localStorage.getItem('hrm_token')}catch(e){}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var NAVICON={dash:'home',att:'clock',leave:'leave',overtime:'clock',pay:'pay',reports:'logs',notifications:'doc',emps:'people',org:'org',cfg:'cfg',users:'key',logs:'logs'};
function mng(){return me&&(me.role==='admin'||me.role==='hr')}
function toast(message,type){
 var root=$('toast-root');if(!root)return;
 var item=document.createElement('div');item.className='toast '+(type||'');item.textContent=message;root.appendChild(item);
 setTimeout(function(){item.remove()},3600)
}
var busyCounts=new WeakMap();
function lockActiveButton(){
 var button=document.activeElement;
 if(!button||button.tagName!=='BUTTON'||button.disabled||!button.classList.contains('btn'))return null;
 var count=busyCounts.get(button)||0;busyCounts.set(button,count+1);button.disabled=true;button.setAttribute('aria-busy','true');return button
}
function unlockButton(button){
 if(!button)return;var count=(busyCounts.get(button)||1)-1;
 if(count>0){busyCounts.set(button,count);return}
 busyCounts.delete(button);button.removeAttribute('aria-busy');button.disabled=false
}
function filterRender(inputId,stateName,pageName){
 var input=$(inputId);if(!input)return;window[stateName]=input.value;window[pageName]=1;
 clearTimeout(window['_filter_'+inputId]);
 var start=input.selectionStart,end=input.selectionEnd;
 window['_filter_'+inputId]=setTimeout(function(){
  render().then(function(){var next=$(inputId);if(next){next.focus();if(next.setSelectionRange)next.setSelectionRange(start,end)}})
 },280)
}
function pageData(items,page,size){var count=Math.max(1,Math.ceil(items.length/size));page=Math.min(Math.max(1,page),count);return{items:items.slice((page-1)*size,page*size),page:page,count:count,total:items.length}}
function pageBar(page,count,total,key){
 if(count<2)return '';
 return '<div class="pager"><span>'+total+' kết quả · trang '+page+'/'+count+'</span><button class="btn g s" '+(page<=1?'disabled':'')+' onclick="setPage(\''+key+'\','+(page-1)+')">‹</button><button class="btn g s" '+(page>=count?'disabled':'')+' onclick="setPage(\''+key+'\','+(page+1)+')">›</button></div>'
}
function setPage(key,page){var names={employees:'empPage',attendance:'attPage',leave:'leavePage',overtime:'otPage'};window[names[key]]=page;render()}
function allowedViews(role){
 var core=['dash','att','leave','overtime','pay'];
 if(role==='admin')return core.concat(['reports','notifications','emps','org','cfg','users','logs']);
 if(role==='hr')return core.concat(['reports','notifications','emps','org','cfg','logs']);
 if(role==='manager')return core.concat(['reports','notifications','emps']);
 return core;
}
function nameOf(l,id){var x=l.find(function(i){return i.id===id});return x?x.name:'-'}
async function api(p,m,b){
 var button=lockActiveButton();
 try{
 var r=await fetch('/api'+p,{method:m||'GET',headers:Object.assign({'Content-Type':'application/json'},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),body:b?JSON.stringify(b):undefined});
 var d=await r.json().catch(function(){return{}});
 if(r.status===401&&TOKEN){setTok(null);me=null;authUI('login','Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại');throw new Error('401')}
 if(!r.ok)throw new Error(d.error||'Lỗi '+r.status);return d
 }finally{unlockButton(button)}}
async function downloadCsv(p){
 var r=await fetch('/api'+p,{headers:TOKEN?{Authorization:'Bearer '+TOKEN}:{}});
 if(r.status===401){setTok(null);me=null;authUI('login','Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại');throw new Error('401')}
 if(!r.ok){var d=await r.json().catch(function(){return{}});throw new Error(d.error||'Không tải được file CSV')}
 var disposition=r.headers.get('Content-Disposition')||'',match=/filename="([^"]+)"/i.exec(disposition),name=match?match[1]:'du-lieu.csv';
 var url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function setTok(t){TOKEN=t;try{t?localStorage.setItem('hrm_token',t):localStorage.removeItem('hrm_token')}catch(e){}}

/* AUTH */
var regOpen=false; // chỉ true khi hệ thống chưa có tài khoản nào (tạo Admin đầu tiên)
function authUI(mode,msg,ok){var reg=mode==='reg'&&regOpen;
 $('app').innerHTML='<div class="auth"><div class="auth-l">'+brand('Quản lý nhân sự')+
 '<div><h1>Chuyện nhân sự, gọn trong một chỗ.</h1><p>Chấm công, nghỉ phép, bảng lương và hồ sơ nhân viên, ai cần gì thì thấy đúng phần đó.</p>'+scene()+'</div><span></span></div>'+
 '<div class="auth-r"><div class="auth-f"><h2>'+(reg?'Tạo tài khoản Admin':'Chào mừng bạn quay lại')+'</h2><div class="mut">'+(reg?'Đây là tài khoản đầu tiên của hệ thống.':'Đăng nhập để vào hệ thống quản lý nhân sự.')+'</div>'+
 (reg?'<label>Họ tên</label><input id="a_n">':'')+'<label>Email</label><input id="a_e" type="email" autocomplete="username">'+
 '<label>Mật khẩu'+(reg?' (tối thiểu 8 ký tự)':'')+'</label><input id="a_p" type="password" minlength="'+(reg?'8':'1')+'" autocomplete="'+(reg?'new-password':'current-password')+'">'+
 (reg?'<label>Nhập lại mật khẩu</label><input id="a_p2" type="password" autocomplete="new-password">':'')+
 (msg?'<div class="'+(ok?'okm':'err')+'">'+esc(msg)+'</div>':'')+
 '<div style="margin-top:18px"><button class="btn" style="width:100%;padding:12px" onclick="'+(reg?'doReg()':'doLogin()')+'">'+(reg?'Tạo tài khoản':'Đăng nhập')+'</button></div>'+
 '<p class="mut" style="text-align:center;margin:16px 0 0">'+(reg?'Đã có tài khoản? <a href="#" onclick="authUI(\'login\');return false">Đăng nhập</a>':(regOpen?'Hệ thống chưa có tài khoản nào. <a href="#" onclick="authUI(\'reg\');return false">Tạo tài khoản Admin đầu tiên</a>':'Chưa có tài khoản? Liên hệ Admin hoặc HR để được cấp.')+'<br><a href="#" onclick="forgotPasswordUI();return false">Quên mật khẩu?</a>')+'</p></div></div></div>';
 $('a_e').focus();
 $('app').onkeydown=function(e){if(e.key==='Enter')(reg?doReg:doLogin)()}}
async function doReg(){
 if($('a_p').value!==$('a_p2').value)return authUI('reg','Mật khẩu nhập lại không khớp');
 try{var r=await api('/auth/register','POST',{name:$('a_n').value,email:$('a_e').value,password:$('a_p').value});
  regOpen=false;authUI('login','Đã tạo tài khoản Admin. Hãy đăng nhập',true)}
 catch(e){authUI('reg',e.message)}}
async function doLogin(){
 try{var r=await api('/auth/login','POST',{email:$('a_e').value,password:$('a_p').value});setTok(r.token);me=r.user;if(me.must_change_password)return forcePasswordChange();view='dash';render()}
 catch(e){authUI('login',e.message)}}
function logout(){setTok(null);me=null;authUI('login')}
function forgotPasswordUI(msg,ok){
 $('app').onkeydown=function(e){if(e.key==='Enter')requestPasswordReset()};
 $('app').innerHTML='<div class="auth"><div class="auth-r" style="margin:auto"><div class="auth-f"><h2>Khôi phục mật khẩu</h2><div class="mut">Nhập email tài khoản. Nếu email hợp lệ, hệ thống sẽ gửi liên kết đặt lại mật khẩu.</div>'+
 '<label>Email</label><input id="forgot_email" type="email" autocomplete="email">'+
 (msg?'<div class="'+(ok?'okm':'err')+'">'+esc(msg)+'</div>':'')+
 '<div style="display:flex;gap:8px;margin-top:18px"><button class="btn" style="flex:1" onclick="requestPasswordReset()">Gửi liên kết</button><button class="btn g" onclick="authUI(\'login\')">Quay lại</button></div></div></div></div>';
 $('forgot_email').focus();
}
async function requestPasswordReset(){
 try{var r=await api('/auth/forgot-password','POST',{email:$('forgot_email').value});forgotPasswordUI(r.message,true)}
 catch(e){forgotPasswordUI(e.message)}
}
function resetPasswordUI(token,msg,ok){
 if(ok){
  $('app').onkeydown=null;
  $('app').innerHTML='<div class="auth"><div class="auth-r" style="margin:auto"><div class="auth-f"><h2>Đã đổi mật khẩu</h2><div class="okm">'+esc(msg)+'</div><button class="btn" style="width:100%;margin-top:18px" onclick="authUI(\'login\')">Đến trang đăng nhập</button></div></div></div>';
  return;
 }
 $('app').onkeydown=function(e){if(e.key==='Enter')submitPasswordReset(token)};
 $('app').innerHTML='<div class="auth"><div class="auth-r" style="margin:auto"><div class="auth-f"><h2>Đặt lại mật khẩu</h2><div class="mut">Tạo mật khẩu mới có ít nhất 8 ký tự.</div>'+
 '<label>Mật khẩu mới</label><input id="reset_password" type="password" minlength="8" autocomplete="new-password">'+
 '<label>Nhập lại mật khẩu</label><input id="reset_confirm" type="password" minlength="8" autocomplete="new-password">'+
 (msg?'<div class="'+(ok?'okm':'err')+'">'+esc(msg)+'</div>':'')+
 '<div style="display:flex;gap:8px;margin-top:18px"><button class="btn" style="flex:1" onclick="submitPasswordReset(\''+esc(token)+'\')">Lưu mật khẩu mới</button><button class="btn g" onclick="authUI(\'login\')">Quay lại đăng nhập</button></div></div></div></div>';
 $('reset_password').focus();
}
async function submitPasswordReset(token){
 var password=$('reset_password').value;
 if(password.length<8)return resetPasswordUI(token,'Mật khẩu mới tối thiểu 8 ký tự');
 if(password!==$('reset_confirm').value)return resetPasswordUI(token,'Mật khẩu nhập lại không khớp');
 try{
  var r=await api('/auth/reset-password','POST',{token:token,password:password});
  history.replaceState(null,'',location.pathname);
  resetPasswordUI('',r.message,true);
 }catch(e){if(e.message!=='401')resetPasswordUI(token,e.message)}
}
function forcePasswordChange(msg){
 $('app').onkeydown=function(e){if(e.key==='Enter')submitFirstPasswordChange()};
 $('app').innerHTML='<div class="auth"><div class="auth-r" style="margin:auto"><div class="auth-f"><h2>Đổi mật khẩu bắt buộc</h2><div class="mut">Vì lý do bảo mật, bạn cần tạo mật khẩu riêng trước khi sử dụng hệ thống.</div>'+
 '<label>Mật khẩu tạm hiện tại</label><input id="first_old" type="password" autocomplete="current-password">'+
 '<label>Mật khẩu mới (tối thiểu 8 ký tự)</label><input id="first_new" type="password" minlength="8" autocomplete="new-password">'+
 '<label>Nhập lại mật khẩu mới</label><input id="first_confirm" type="password" minlength="8" autocomplete="new-password">'+
 (msg?'<div class="err">'+esc(msg)+'</div>':'')+
 '<div style="display:flex;gap:8px;margin-top:18px"><button class="btn" style="flex:1" onclick="submitFirstPasswordChange()">Đổi mật khẩu</button><button class="btn g" onclick="logout()">Thoát</button></div></div></div></div>';
 $('first_old').focus();
}
async function submitFirstPasswordChange(){
 var next=$('first_new').value;
 if(next.length<8)return forcePasswordChange('Mật khẩu mới tối thiểu 8 ký tự');
 if(next!==$('first_confirm').value)return forcePasswordChange('Mật khẩu nhập lại không khớp');
 try{await api('/auth/change-password','POST',{current:$('first_old').value,next:next});me=(await api('/auth/me')).user;view='dash';render()}
 catch(e){if(e.message!=='401')forcePasswordChange(e.message)}
}

/* SHELL */
async function render(){
 var labels={dash:'Tổng quan',att:'Chấm công',leave:'Nghỉ phép',overtime:'Tăng ca',pay:mng()?'Bảng lương':'Phiếu lương',reports:'Báo cáo',notifications:'Thông báo',emps:me.role==='employee'?'Hồ sơ của tôi':'Nhân viên',org:'Cơ cấu tổ chức',cfg:'Cấu hình',users:'Tài khoản',logs:'Nhật ký thao tác'};
 var tabs=allowedViews(me.role).map(function(key){return[key,labels[key]]});
 if(!tabs.some(function(t){return t[0]===view})&&view!=='profile')view='dash';
 $('app').onkeydown=null;
 var cur=tabs.filter(function(t){return t[0]===view})[0]||(view==='profile'?['profile','Hồ sơ cá nhân']:tabs[0]);
 $('app').innerHTML='<aside class="sb" id="sb">'+brand('Quản lý nhân sự')+
 '<nav class="nv">'+tabs.map(function(t){return '<button class="ni'+(t[0]===view?' on':'')+'" onclick="go(\''+t[0]+'\')"><span class="ic">'+ico(NAVICON[t[0]])+'</span>'+t[1]+'</button>'}).join('')+'</nav>'+
 '<div class="me"><button class="me-profile'+(view==='profile'?' on':'')+'" onclick="go(\'profile\')" aria-label="Mở hồ sơ cá nhân"><span>'+avatar(me.name)+'</span><span class="me-t"><span style="min-width:0"><b>'+esc(me.name)+'</b><span class="r">'+ROLES[me.role]+'</span></span></span></button><span class="me-hint">'+ico('profile')+'Hồ sơ cá nhân</span>'+
 '<div class="me-a"><button onclick="pwModal()">'+ico('lock')+'Mật khẩu</button><button onclick="logout()">'+ico('out')+'Thoát</button></div></div></aside>'+
 '<div class="scrim" id="scrim" onclick="navToggle(false)"></div>'+
 '<div class="ct"><div class="mbar"><button class="mb" onclick="navToggle(true)" aria-label="Mở menu">'+ico('menu')+'</button>'+brand()+'</div>'+
 '<div class="main"><div id="ph">'+(view==='dash'?'':'<div class="ph"><h1>'+cur[1]+'</h1></div>')+'</div><div id="v"><p class="mut">Đang tải...</p></div></div></div>';
 try{[depts,poss]=await Promise.all([api('/departments'),api('/positions')]);await({dash:vDash,att:vAtt,leave:vLeave,overtime:vOvertime,pay:vPay,reports:vReports,notifications:vNotifications,cfg:vCfg,emps:vEmps,profile:vProfile,org:vOrg,users:vUsers,logs:vLogs})[view]()}
 catch(e){if(e.message!=='401')$('v').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
function navToggle(o){var a=$('sb'),b=$('scrim');if(a)a.classList.toggle('open',o);if(b)b.classList.toggle('open',o)}
function go(v){view=v;q='';fd='';resetViews();render()}
function fail(e){if(e.message!=='401')toast(e.message,'error')}

/* MODAL */
function modal(title,fields,vals,cb,extra,okText){
 var h='<div class="ov"><div class="md"><h2>'+title+'</h2>'+(extra||'');
 fields.forEach(function(f){var v=vals[f[0]];h+='<label>'+f[1]+'</label>';
  if(f[2]==='select')h+='<select id="f_'+f[0]+'"'+(f[4]?' disabled':'')+'>'+f[3].map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(v==null?'':v)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
  else if(f[2]==='area')h+='<textarea id="f_'+f[0]+'" rows="7">'+esc(v||'')+'</textarea>';
  else h+='<input id="f_'+f[0]+'" type="'+(f[2]||'text')+'" value="'+esc(v||'')+'"'+(f[4]?' disabled':'')+'>'});
 h+='<div id="me"></div><div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="btn g" onclick="closeM()">Đóng</button><button class="btn" id="mok">'+(okText||'Lưu')+'</button></div></div></div>';
 $('m').innerHTML=h;
 $('mok').onclick=async function(){var o={};fields.forEach(function(f){o[f[0]]=$('f_'+f[0]).value});$('mok').disabled=true;
  try{var r=await cb(o);if(r){$('me').innerHTML='<div class="'+(r.charAt(0)==='+'?'okm':'err')+'">'+esc(r.replace(/^\+/,''))+'</div>';$('mok').disabled=false;if(r.charAt(0)==='+')toast(r.replace(/^\+/,''),'success')}else{closeM();render();toast('Đã lưu thay đổi','success')}}
  catch(e){if(e.message!=='401'){$('me').innerHTML='<div class="err">'+esc(e.message)+'</div>';$('mok').disabled=false}}}}
function closeM(){$('m').innerHTML=''}
function pwModal(){modal('Đổi mật khẩu',[['o','Mật khẩu hiện tại','password'],['n','Mật khẩu mới (tối thiểu 8 ký tự)','password']],{},async function(v){
 await api('/auth/change-password','POST',{current:v.o,next:v.n});return '+Đã đổi mật khẩu'})}

/* PROFILE */
async function vProfile(){
 var result=await api('/employees?q='+encodeURIComponent(me.email));
 var employee=result.find(function(e){return e.email.toLowerCase()===me.email.toLowerCase()});
 if(!employee){
  $('v').innerHTML='<div class="card"><h2>Chưa có hồ sơ nhân viên</h2><p class="mut">Tài khoản của bạn chưa được liên kết với hồ sơ nhân viên. Vui lòng liên hệ HR để được hỗ trợ.</p></div>';
  return;
 }
 emps=[employee];
 var fields=[['Mã nhân viên',employee.code],['Email',employee.email],
  ['Số điện thoại',employee.phone||'Chưa cập nhật'],['Phòng ban',employee.department||'Chưa phân công'],
  ['Chức danh',employee.position||'Chưa cập nhật'],['Trạng thái',employee.status||'Chưa cập nhật'],
  ['Ngày vào làm',employee.start_date||'Chưa cập nhật']];
 var canEdit=mng()||employee.email.toLowerCase()===me.email.toLowerCase();
 $('v').innerHTML='<div class="card"><div class="profile-head"><div class="profile-person">'+avatar(employee.name,true)+'<div><h2>'+esc(employee.name)+'</h2><span class="mut">'+ROLES[me.role]+' · Hồ sơ nhân viên</span></div></div>'+
 '<div class="profile-actions">'+(canEdit?'<button class="btn g" onclick="empForm('+employee.id+')">Chỉnh sửa hồ sơ</button>':'')+
 '<button class="btn g" onclick="showHistory('+employee.id+')">Lịch sử thay đổi</button></div></div>'+
 '<div class="profile-fields">'+fields.map(function(field){return '<div class="profile-field"><span>'+field[0]+'</span><b>'+esc(field[1])+'</b></div>'}).join('')+'</div></div>';
}

/* EMPLOYEES */
async function vEmps(){
 var h='<div class="bar">';
 if(me.role!=='employee')h+='<input placeholder="Tìm theo tên, mã, email..." value="'+esc(q)+'" oninput="q=this.value;empPage=1;clearTimeout(window._t);window._t=setTimeout(tbl,250)"><select onchange="fd=this.value;empPage=1;tbl()"><option value="">Tất cả phòng ban</option>'+depts.map(function(d){return '<option value="'+d.id+'"'+(String(d.id)===fd?' selected':'')+'>'+esc(d.name)+'</option>'}).join('')+'</select>';
 if(mng())h+='<button class="btn" onclick="empForm()">+ Thêm nhân viên</button><button class="btn g" onclick="impForm()">Import CSV</button>';
 if(me.role!=='employee')h+='<button class="btn g" onclick="downloadCsv(\'/employees/export\'+(fd?\'?department_id=\'+encodeURIComponent(fd):\'\')).catch(fail)">Xuất CSV</button>';
 var intro='';
 if(me.role==='employee'){
  var snapshot=await Promise.all([api('/attendance/month?month='+thisMonth()),api('/leave/balance')]);
  var att=snapshot[0][0]||{}, leave=snapshot[1];
  intro='<div class="card"><h2>Thông tin của bạn</h2><p class="mut">'+esc(att.department||'Chưa phân phòng ban')+' · tháng '+thisMonth()+'</p>'+
   '<div class="kpis">'+kpi('Ngày công',att.present||0,'tháng này','check')+kpi('Phép đã dùng',leave.used,'năm '+leave.year,'leave')+kpi('Phép còn lại',leave.remaining,'trên '+leave.quota+' ngày','sun')+'</div>'+
   '<button class="btn g s" onclick="showHistory('+(att.employee_id||0)+')">Lịch sử hồ sơ</button></div>';
 }
 $('v').innerHTML=intro+h+'</div><div class="card tw" id="tb"></div>';await tbl()}
var emps=[];
async function tbl(){
 try{emps=await api('/employees?q='+encodeURIComponent(q)+'&department_id='+encodeURIComponent(fd))}catch(e){return fail(e)}
var page=pageData(emps,empPage,10);empPage=page.page;emps=page.items;
var h='<table><tr><th>Mã</th><th>Nhân viên</th><th>SĐT</th><th>Phòng ban</th><th>Chức danh</th><th>Trạng thái</th><th></th></tr>';
 emps.forEach(function(e){h+='<tr><td class="mut">'+esc(e.code)+'</td><td><div class="who">'+avatar(e.name)+'<div><b>'+esc(e.name)+'</b><span class="mut">'+esc(e.email)+'</span></div></div></td><td>'+esc(e.phone)+'</td><td>'+esc(e.department||'-')+'</td><td>'+esc(e.position||'-')+'</td><td><span class="tag '+(e.status==='Chính thức'?'t-ok':e.status==='Nghỉ việc'?'t-off':'t-wa')+'">'+esc(e.status)+'</span></td><td style="white-space:nowrap;text-align:right">'+
  (mng()||e.email===me.email?'<button class="btn g s" onclick="empForm('+e.id+')">Sửa</button>':'')+' <button class="btn g s" onclick="showHistory('+e.id+')">Lịch sử</button>'+(mng()?' <button class="btn r s" onclick="empDel('+e.id+')">Xóa</button>':'')+'</td></tr>'});
 $('tb').innerHTML=h+(page.total?'':'<tr><td colspan="7" class="empty">Chưa có nhân viên nào khớp. Thử bỏ bớt bộ lọc hoặc thêm nhân viên mới.</td></tr>')+'</table>'+pageBar(page.page,page.count,page.total,'employees')}
function opts(l,z){return [['',z]].concat(l.map(function(i){return [i.id,i.name]}))}
function empForm(id){
 var e=id?emps.find(function(x){return x.id===id}):{code:'',status:'Thử việc'},full=mng(),dis=!full;
 modal(id?'Sửa hồ sơ':'Thêm nhân viên',[['code','Mã nhân viên','text',0,dis],['name','Họ tên','text',0,dis],['email','Email','email',0,dis||!!id],['phone','Số điện thoại'],
  ['department_id','Phòng ban','select',opts(depts,'-- Chọn --'),dis],['position_id','Chức danh','select',opts(poss,'-- Chọn --'),dis],
  ['status','Trạng thái','select',['Thử việc','Chính thức','Nghỉ việc','Chờ cập nhật'].map(function(s){return [s,s]}),dis],['start_date','Ngày vào làm','date',0,dis]],e,async function(v){
  v.department_id=v.department_id?+v.department_id:null;v.position_id=v.position_id?+v.position_id:null;
  if(id)await api('/employees/'+id,'PUT',full?v:{phone:v.phone});else await api('/employees','POST',v)})}
function empDel(id){var e=emps.find(function(x){return x.id===id});
 modal('Xóa nhân viên',[],{},async function(){await api('/employees/'+id,'DELETE')},'<p>Xóa hồ sơ <b>'+esc(e.name)+'</b>? Thao tác không hoàn tác được.</p>','Xóa hồ sơ')}
function impForm(){
 modal('Import nhân viên từ CSV',[['csv','Dán dữ liệu, mỗi dòng một người','area']],{},async function(v){
  var r=await api('/employees/import','POST',{csv:v.csv});
  if(!r.errors.length)return null;
  return '+Đã thêm '+r.imported+' dòng. Dòng lỗi: '+r.errors.slice(0,6).join('; ')},'<p class="mut">Cột: mã, họ tên, email, phòng ban, chức danh<br>Ví dụ: NV010, Nguyễn An, an@cty.vn, Kỹ thuật, Nhân viên</p>','Import')}

/* ORG */
function vOrg(){
 function box(t,l,key){return '<div class="card"><h2>'+t+'</h2>'+l.map(function(i){return '<div class="li"><span>'+esc(i.name)+'</span><button class="btn r s" onclick="orgDel(\''+key+'\','+i.id+')">Xóa</button></div>'}).join('')+
  '<div class="bar" style="margin:10px 0 0"><input id="n_'+key+'" placeholder="Tên mới"><button class="btn" onclick="orgAdd(\''+key+'\')">Thêm</button></div></div>'}

async function orgAdd(k){var n=$('n_'+k).value.trim();if(!n)return;try{await api('/'+k,'POST',{name:n});render()}catch(e){fail(e)}}
async function orgDel(k,id){try{await api('/'+k+'/'+id,'DELETE');render()}catch(e){fail(e)}}

/* USERS */
async function vUsers(){
 var us=await api('/users');
 var h='<div class="bar"><button class="btn" onclick="userNew()">+ Tạo tài khoản</button></div><div class="card tw"><table><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th></th></tr>';
 us.forEach(function(u){var self=u.id===me.id;
  h+='<tr><td><div class="who">'+avatar(u.name)+'<b>'+esc(u.name)+'</b></div></td><td>'+esc(u.email)+'</td><td><select style="width:auto" '+(self?'disabled':'')+' onchange="setRole('+u.id+',this.value)">'+Object.keys(ROLES).map(function(r){return '<option value="'+r+'"'+(u.role===r?' selected':'')+'>'+ROLES[r]+'</option>'}).join('')+'</select></td><td>'+
  (self?'':'<button class="btn g s" onclick="resetPw('+u.id+')">Đặt lại mật khẩu</button> <button class="btn r s" onclick="delUser('+u.id+')">Xóa</button>')+'</td></tr>'});
 $('v').innerHTML=h+'</table></div>'}
function userNew(){
 modal('Tạo tài khoản',[['name','Họ tên'],['email','Email đăng nhập','email'],['role','Vai trò','select',Object.keys(ROLES).map(function(r){return [r,ROLES[r]]}),0]],{role:'employee'},async function(v){
  var r=await api('/users','POST',{name:v.name,email:v.email,role:v.role});
  render();
  return '+Đã tạo tài khoản. Mật khẩu tạm (chỉ hiện một lần, hãy chuyển cho nhân viên và yêu cầu đổi ngay): '+r.temporaryPassword})}
async function setRole(id,r){try{await api('/users/'+id+'/role','PUT',{role:r})}catch(e){fail(e);render()}}
async function resetPw(id){if(!confirm('Đặt lại mật khẩu cho tài khoản này?'))return;
 try{var r=await api('/users/'+id+'/reset-password','POST');
  modal('Mật khẩu tạm',[],{},async function(){},'<p>Chuyển mật khẩu này cho nhân viên và yêu cầu đổi ngay sau khi đăng nhập. Mật khẩu chỉ hiện một lần.</p><p style="font:600 18px monospace;user-select:all">'+esc(r.temporaryPassword)+'</p>','Xong')}catch(e){fail(e)}}
async function delUser(id){if(!confirm('Xóa tài khoản này? Hồ sơ nhân viên vẫn được giữ lại.'))return;try{await api('/users/'+id,'DELETE');render()}catch(e){fail(e)}}
